<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${author.fullName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('authors')}"></nav>

<main class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/authors}">Authors</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${author.fullName}">Name</li>
        </ol>
    </nav>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="bh-card p-4 mb-4 d-flex flex-wrap gap-4 align-items-start">
        <span class="bh-avatar lg" th:text="${author.initials}">GH</span>
        <div class="flex-grow-1">
            <h1 class="mb-1" th:text="${author.fullName}">Name</h1>
            <p class="text-body-secondary mb-2">
                <i class="bi bi-globe2"></i> <span th:text="${author.nationality} ?: 'Unknown'">Country</span>
                <th:block th:if="${author.email}">
                    &nbsp;·&nbsp; <i class="bi bi-envelope"></i>
                    <a th:href="'mailto:' + ${author.email}" th:text="${author.email}">mail</a>
                </th:block>
            </p>
            <p class="mb-0" th:text="${author.biography} ?: 'No biography recorded.'">Bio</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/authors/{id}/edit(id=${author.authorId})}" class="btn btn-outline-bh">
                <i class="bi bi-pencil"></i> Edit</a>
            <form th:action="@{/authors/{id}(id=${author.authorId})}" th:method="delete"
                  th:attr="data-confirm='Delete ' + ${author.fullName} + '? Their books stay in the catalogue.'">
                <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash"></i> Delete</button>
            </form>
        </div>
    </div>

    <h2 class="h4 mb-3">Books by <span th:text="${author.fullName}">Name</span>
        <span class="badge rounded-pill bh-badge-stock align-middle fs-6" th:text="${#lists.size(books)}">3</span></h2>

    <div th:if="${#lists.isEmpty(books)}" class="bh-card p-4 text-center text-body-secondary">
        No books by this author in the catalogue yet.
    </div>
    <div th:unless="${#lists.isEmpty(books)}" class="bh-card">
        <div class="table-responsive">
            <table class="table table-hover bh-table">
                <thead><tr><th>Title</th><th>Year</th><th>Co-authors</th><th class="text-end">Price</th><th class="text-end">Stock</th></tr></thead>
                <tbody>
                <tr th:each="b : ${books}">
                    <td class="title-cell"><a th:href="@{/books/{id}(id=${b.bookId})}" th:text="${b.title}">T</a></td>
                    <td th:text="${b.publishYear} ?: '—'">2020</td>
                    <td>
                        <th:block th:each="co : ${b.authors}" th:if="${co.authorId != author.authorId}">
                            <a th:href="@{/authors/{id}(id=${co.authorId})}" th:text="${co.fullName}" class="me-1">Co</a>
                        </th:block>
                    </td>
                    <td class="text-end bh-price" th:text="'¥' + ${b.price}">¥</td>
                    <td class="text-end"><span th:replace="~{fragments/layout :: stockBadge(${b})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
