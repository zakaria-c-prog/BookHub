<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Shared page pieces, included by every view with th:replace -->

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · BookHub'">BookHub</title>
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#060814">
    <script>document.documentElement.setAttribute('data-bs-theme', 'dark');</script>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/bookhub.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-md navbar-dark bh-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="bh-logo"><i class="bi bi-book-half"></i></span>
            <span class="bh-brand">BookHub</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-md-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}">
                        <i class="bi bi-speedometer2"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'books'} ? 'active'" th:href="@{/books}">
                        <i class="bi bi-journals"></i> Catalogue</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'authors'} ? 'active'" th:href="@{/authors}">
                        <i class="bi bi-person-lines-fill"></i> Authors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'providers'} ? 'active'" th:href="@{/providers}">
                        <i class="bi bi-truck"></i> Providers</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Flash messages set by RedirectAttributes after an update -->
<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex gap-2" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${success}">Saved.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex gap-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}">Something went wrong.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- Stock badge for one book -->
<span th:fragment="stockBadge(book)">
    <span th:if="${book.outOfStock}" class="badge rounded-pill text-bg-danger">Out of stock</span>
    <span th:if="${book.lowStock}" class="badge rounded-pill text-bg-warning"
          th:text="${book.stock} + ' left'">3 left</span>
    <span th:unless="${book.outOfStock or book.lowStock}" class="badge rounded-pill bh-badge-stock"
          th:text="${book.stock} + ' in stock'">12 in stock</span>
</span>

<footer th:fragment="footer" class="bh-footer mt-5">
    <div class="container d-flex flex-wrap justify-content-between gap-2 py-4">
        <span><i class="bi bi-book-half"></i> BookHub &mdash; Software Design course project, NJUST</span>
        <span class="text-body-secondary">Spring MVC · Thymeleaf · JDBC · MySQL · Tomcat</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/bookhub.js}"></script>
</footer>

</body>
</html>
