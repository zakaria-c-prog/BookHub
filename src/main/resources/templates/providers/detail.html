<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${provider.companyName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('providers')}"></nav>

<main class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/providers}">Providers</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${provider.companyName}">Co</li>
        </ol>
    </nav>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="row g-4 mb-4">
        <div class="col-lg-8">
            <div class="bh-card p-4 h-100">
                <div class="d-flex flex-wrap justify-content-between gap-3">
                    <div>
                        <h1 class="mb-3" th:text="${provider.companyName}">Company</h1>
                        <p class="mb-1"><i class="bi bi-geo-alt"></i> <span th:text="${provider.city} ?: 'City not recorded'">City</span></p>
                        <p class="mb-1"><i class="bi bi-telephone"></i> <span th:text="${provider.phone} ?: 'No phone'">Phone</span></p>
                        <p class="mb-0"><i class="bi bi-envelope"></i>
                            <a th:if="${provider.email}" th:href="'mailto:' + ${provider.email}" th:text="${provider.email}">mail</a>
                            <span th:unless="${provider.email}">No e-mail</span></p>
                    </div>
                    <div class="d-flex gap-2 align-items-start">
                        <a th:href="@{/providers/{id}/edit(id=${provider.providerId})}" class="btn btn-outline-bh">
                            <i class="bi bi-pencil"></i> Edit</a>
                        <form th:action="@{/providers/{id}(id=${provider.providerId})}" th:method="delete"
                              th:attr="data-confirm='Delete ' + ${provider.companyName} + '? Its books will be kept without a provider.'">
                            <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash"></i> Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="bh-card bh-stat mb-3">
                <div class="value" th:text="${#lists.size(books)}">4</div>
                <div class="label">Titles supplied</div>
            </div>
            <div class="bh-card bh-stat amber">
                <div class="value" th:text="'¥' + ${#numbers.formatDecimal(stockValue, 1, 'COMMA', 2, 'POINT')}">¥0</div>
                <div class="label">Value of stock on hand</div>
            </div>
        </div>
    </div>

    <h2 class="h4 mb-3">Books from this provider</h2>
    <div th:if="${#lists.isEmpty(books)}" class="bh-card p-4 text-center text-body-secondary">
        This provider doesn't supply any books yet.
    </div>
    <div th:unless="${#lists.isEmpty(books)}" class="bh-card">
        <div class="table-responsive">
            <table class="table table-hover bh-table">
                <thead><tr><th>Title</th><th>Category</th><th class="text-end">Price</th><th class="text-end">Stock</th></tr></thead>
                <tbody>
                <tr th:each="b : ${books}">
                    <td class="title-cell"><a th:href="@{/books/{id}(id=${b.bookId})}" th:text="${b.title}">T</a><br>
                        <small th:text="${b.authorNames}">A</small></td>
                    <td><span class="bh-chip" th:text="${b.category}">C</span></td>
                    <td class="text-end bh-price" th:text="'¥' + ${b.price}">¥</td>
                    <td class="text-end"><span th:replace="~{fragments/layout :: stockBadge(${b})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
