<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container py-5 text-center" style="max-width: 640px">
    <i class="bi bi-journal-x display-1 text-body-secondary"></i>
    <h1 class="mt-3" th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Something went wrong</h1>
    <p class="lead text-body-secondary"
       th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'The request could not be completed.'">Message</p>
    <p class="small text-body-secondary" th:if="${status}" th:text="'HTTP ' + ${status}">HTTP 500</p>
    <a th:href="@{/}" class="btn btn-bh mt-2"><i class="bi bi-house"></i> Back to dashboard</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
