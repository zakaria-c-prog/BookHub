<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${bookId == null ? 'New book' : 'Edit book'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('books')}"></nav>

<main class="container py-4" style="max-width: 960px">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/books}">Catalogue</a></li>
            <li th:if="${bookId}" class="breadcrumb-item">
                <a th:href="@{/books/{id}(id=${bookId})}" th:text="${form.title}">Book</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${bookId == null ? 'New book' : 'Edit'}">New</li>
        </ol>
    </nav>

    <h1 class="mb-4" th:text="${bookId == null ? 'Add a new book' : 'Edit book'}">Add a new book</h1>

    <!-- th:method="put" makes Thymeleaf add the hidden _method field -->
    <form th:object="${form}"
          th:action="${bookId == null} ? @{/books} : @{/books/{id}(id=${bookId})}"
          th:method="${bookId == null} ? 'post' : 'put'"
          class="bh-card p-4" novalidate>

        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
            Please correct the highlighted fields.
        </div>

        <div class="row g-3">
            <div class="col-md-8">
                <label for="title" class="form-label fw-semibold">Title *</label>
                <input th:field="*{title}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{title}">error</div>
            </div>
            <div class="col-md-4">
                <label for="isbn" class="form-label fw-semibold">ISBN *</label>
                <input th:field="*{isbn}" class="form-control font-monospace" placeholder="978-7-300-00000-0"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{isbn}">error</div>
            </div>

            <div class="col-md-4">
                <label for="category" class="form-label fw-semibold">Category *</label>
                <input th:field="*{category}" class="form-control" list="categoryList" th:errorclass="is-invalid">
                <datalist id="categoryList">
                    <option th:each="c : ${categories}" th:value="${c}"></option>
                </datalist>
                <div class="invalid-feedback" th:errors="*{category}">error</div>
            </div>
            <div class="col-md-3">
                <label for="price" class="form-label fw-semibold">Price (¥) *</label>
                <input th:field="*{price}" type="number" step="0.01" min="0.01" class="form-control"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{price}">error</div>
            </div>
            <div class="col-md-2">
                <label for="stock" class="form-label fw-semibold">Stock *</label>
                <input th:field="*{stock}" type="number" min="0" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{stock}">error</div>
            </div>
            <div class="col-md-3">
                <label for="publishYear" class="form-label fw-semibold">Year published</label>
                <input th:field="*{publishYear}" type="number" min="1450" max="2100" class="form-control"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{publishYear}">error</div>
            </div>

            <div class="col-12">
                <label for="summary" class="form-label fw-semibold">Summary</label>
                <textarea th:field="*{summary}" rows="3" class="form-control" th:errorclass="is-invalid"></textarea>
                <div class="invalid-feedback" th:errors="*{summary}">error</div>
            </div>

            <div class="col-md-5">
                <label for="providerId" class="form-label fw-semibold">Provider</label>
                <select th:field="*{providerId}" class="form-select">
                    <option value="">— no provider —</option>
                    <option th:each="p : ${providers}" th:value="${p.providerId}" th:text="${p.companyName}">P</option>
                </select>
                <div class="form-text"><a th:href="@{/providers/new}" target="_blank">Add a provider</a> if it's missing.</div>
            </div>

            <div class="col-md-7">
                <span class="form-label fw-semibold d-block">Author(s)</span>
                <div class="border rounded p-2" style="max-height: 11rem; overflow-y: auto">
                    <div th:each="a : ${allAuthors}" class="form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{authorIds}" th:value="${a.authorId}">
                        <label class="form-check-label" th:for="${#ids.prev('authorIds')}" th:text="${a.fullName}">Author</label>
                    </div>
                    <p th:if="${#lists.isEmpty(allAuthors)}" class="text-body-secondary small m-0">No authors yet.</p>
                </div>
                <div class="form-text">Tick every author of this book.
                    <a th:href="@{/authors/new}" target="_blank">Add an author</a>.</div>
            </div>
        </div>

        <hr class="my-4">
        <div class="d-flex justify-content-end gap-2">
            <a th:href="${bookId == null} ? @{/books} : @{/books/{id}(id=${bookId})}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-bh"><i class="bi bi-save"></i>
                <span th:text="${bookId == null ? 'Add book' : 'Save changes'}">Save</span></button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
