<text x="44" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#c4584f" text-anchor="start" letter-spacing="3">DATA SCIENCE</text>
<text x="42" y="124.0" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#14213d" text-anchor="start" letter-spacing="0">Visual Thinking</text>
<text x="42" y="168.0" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" fill="#14213d" text-anchor="start" letter-spacing="0" font-style="italic">with Data</text>
<text x="44" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start" letter-spacing="2">AMARA OKAFOR · PRIYA RAMAN</text>

