    <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 -1.6 1.15"/>
  </filter>
  <filter id="fibres" x="0" y="0" width="100%" height="100%">
