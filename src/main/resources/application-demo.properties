# "demo" profile: runs against an in-memory H2 database in MySQL
# compatibility mode, so the app can be tried without installing MySQL.
# Activate with:  java -jar target/bookhub.war --spring.profiles.active=demo
spring.datasource.url=jdbc:h2:mem:bookhub_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
