spring.application.name=bookhub
server.port=8081

# ---- MySQL (default profile) ----
# Credentials come from environment variables so none are stored in the project.
spring.datasource.url=jdbc:mysql://localhost:3306/bookhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=${BOOKHUB_DB_USER:root}
spring.datasource.password=${BOOKHUB_DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql + data.sql on every start (both are idempotent)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.messages.basename=messages

# Hidden "_method" field lets HTML forms send PUT/DELETE
spring.mvc.hiddenmethod.filter.enabled=true

# Keep the session id in a cookie, never in the URL (flash messages use the session)
server.servlet.session.tracking-modes=cookie
